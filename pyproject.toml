[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-project-analyzer"
version = "0.2.0"
description = "Clickable Vivado-style diagrams and clock-domain checks for Vivado, Zynq and PYNQ projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{ name = "Abdullah AlNafisah" }]
requires-python = ">=3.8"
keywords = ["fpga", "vivado", "zynq", "pynq", "rtl", "verilog", "vhdl", "cdc", "mcp"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)"]

[project.urls]
Homepage = "https://github.com/al-nafisah/fpga-project-analyzer"

[project.scripts]
fpa = "fpalib.cli:main"

[tool.setuptools]
package-dir = { "" = "skills/fpga-project-analyzer/scripts" }
packages = ["fpalib"]

[tool.setuptools.package-data]
fpalib = ["assets/*.html", "assets/vendor/*", "vivado/*.tcl"]
