<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title><!--FPA:TITLE--></title>
<style>
:root{
  --bg:#fbfcfd;--ink:#1d2733;--muted:#5d6b7c;--line:#d9dee5;--panel:#ffffff;--chip:#eef2f7;
  --box:#dcebf8;--box2:#c4dbf2;--stroke:#3f6a9e;--ps:#d3e3f6;--xbar:#e2ecf7;
  --hier:#e5f0df;--hier2:#d3e6c9;--hier-stroke:#5b8a4a;
  --rtl:#ffffff;--rtl-stroke:#46607e;--reg:#fff6e3;--reg-stroke:#a8741a;--comb:#f4f1fb;--comb-stroke:#6b5aa6;
  --bb:#eceff3;--bb-stroke:#7d8794;
  --wire:#3b4450;--bus:#1f5fa8;--sel:#e8820c;--danger:#d43d3d;--warn:#df9419;--info:#3d8bd6;--ok:#2e9d5b;
  --shadow:0 1px 2px rgba(20,30,40,.12),0 4px 16px rgba(20,30,40,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181c;--ink:#e3e8ee;--muted:#98a4b1;--line:#2d343c;--panel:#1c2026;--chip:#262c34;
  --box:#233a55;--box2:#1b2e45;--stroke:#7ea7d8;--ps:#25405f;--xbar:#1f3046;
  --hier:#223421;--hier2:#1b2a1a;--hier-stroke:#86b46f;
  --rtl:#1b2129;--rtl-stroke:#8fa6c0;--reg:#33290f;--reg-stroke:#d9a441;--comb:#262137;--comb-stroke:#a596de;
  --bb:#262b31;--bb-stroke:#8a95a3;
  --wire:#aab4bf;--bus:#6aa8ff;--sel:#ffa94d;--danger:#ff6b6b;--warn:#f0b44c;--info:#6aa8ff;--ok:#5cc98a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15181c;--ink:#e3e8ee;--muted:#98a4b1;--line:#2d343c;--panel:#1c2026;--chip:#262c34;
  --box:#233a55;--box2:#1b2e45;--stroke:#7ea7d8;--ps:#25405f;--xbar:#1f3046;
  --hier:#223421;--hier2:#1b2a1a;--hier-stroke:#86b46f;
  --rtl:#1b2129;--rtl-stroke:#8fa6c0;--reg:#33290f;--reg-stroke:#d9a441;--comb:#262137;--comb-stroke:#a596de;
  --bb:#262b31;--bb-stroke:#8a95a3;
  --wire:#aab4bf;--bus:#6aa8ff;--sel:#ffa94d;--danger:#ff6b6b;--warn:#f0b44c;--info:#6aa8ff;--ok:#5cc98a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:13px/1.35 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
header{position:fixed;inset:0 0 auto 0;height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
#crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;overflow:hidden;white-space:nowrap}
#crumbs a{color:var(--ink);text-decoration:none;padding:4px 6px;border-radius:5px;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis}
#crumbs a:hover{background:var(--chip)}#crumbs a.cur{font-weight:600}
#crumbs .sep{color:var(--muted)}
#meta{color:var(--muted);font-size:12px;margin-right:6px;white-space:nowrap}
#tools{display:flex;gap:4px;align-items:center}
button,.btn{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;
  height:30px;min-width:30px;padding:0 7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
button:hover{background:var(--chip)}button.on{background:var(--chip);border-color:var(--line)}
button svg{width:16px;height:16px}
#export,#flows{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:6px;height:30px}
#q{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:6px;height:30px;
  width:200px;padding:0 8px}
#issues-btn .n{background:var(--danger);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;font-weight:600}
#issues-btn .n.zero{background:var(--ok)}
main{position:absolute;inset:44px 0 0 0}
svg#svg{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
svg#svg.drag{cursor:grabbing}
#vp{transition:opacity .18s ease}
.fade{opacity:0}
/* blocks */
.node{cursor:pointer}
.node .box{stroke:var(--stroke);stroke-width:1.3;fill:url(#g-ip)}
.k-ps .box{fill:url(#g-ps)}.k-xbar .box{fill:var(--xbar)}
.k-hier .box{fill:url(#g-hier);stroke:var(--hier-stroke)}
.k-rtl .box,.k-bd .box{fill:var(--rtl);stroke:var(--rtl-stroke)}
.k-reg .box{fill:var(--reg);stroke:var(--reg-stroke)}
.k-comb .box,.k-latch .box{fill:var(--comb);stroke:var(--comb-stroke)}
.k-bb .box,.k-prim .box{fill:var(--bb);stroke:var(--bb-stroke)}
.k-bb .box{stroke-dasharray:4 3}
.node.sel .box{stroke:var(--sel);stroke-width:2.4}
.node:hover .box{stroke-width:2}
.iname{font-weight:600;font-size:12px;fill:var(--ink)}
.title{font-size:11px;fill:var(--muted)}
.plabel{font-size:10.5px;fill:var(--ink)}
.plabel.bus{font-weight:600}
.plabel.unc{fill:var(--muted);font-style:italic}
.wm{font-size:22px;font-weight:700;fill:var(--stroke);opacity:.13;letter-spacing:2px}
.tag{font-size:9px;font-weight:700;letter-spacing:.4px}
.note{font-size:10.5px;font-style:italic;fill:var(--ink)}
.chip rect{fill:var(--chip);stroke:var(--line)}
.chip text{font-size:9.5px;fill:var(--muted)}
.drill rect{fill:var(--panel);stroke:currentColor}.drill{color:var(--stroke)}
.drill path{stroke:currentColor;stroke-width:1.5}
.pstub{stroke:var(--wire);stroke-width:1.2}
.pbus{fill:var(--panel);stroke:var(--bus);stroke-width:1.4}
.pbus-plus{stroke:var(--bus);stroke-width:1.3}
.pclk{fill:none;stroke:var(--ink);stroke-width:1}
.pbub{fill:var(--panel);stroke:var(--ink);stroke-width:1}
.port .shape{fill:var(--panel);stroke:var(--wire);stroke-width:1.2}
.port.bus .shape{stroke:var(--bus);stroke-width:2}
.port text{font-size:11px;fill:var(--ink)}
.badge circle{stroke:var(--panel);stroke-width:1.5}
.badge text{font-size:10px;font-weight:700;fill:#fff}
/* wires */
.wire{fill:none;stroke:var(--wire);stroke-width:1.15;stroke-linejoin:round}
.wire.bus{stroke:var(--bus);stroke-width:3}
.wire.rst{stroke-dasharray:5 3}
.wire.mixed{stroke:var(--danger)!important;stroke-dasharray:6 4;stroke-width:2}
.wire.hl{stroke:var(--sel)!important;stroke-width:2.6}
.wire.bus.hl{stroke-width:4}
.wire.bad{stroke:var(--danger)!important;stroke-width:2.4}
.wire.flow{stroke:var(--sel)!important;stroke-dasharray:8 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){.wire.flow{animation:none}}
.hit{fill:none;stroke:transparent;stroke-width:9;cursor:pointer}
.jp{fill:var(--wire)}
.dim .node,.dim .wire,.dim .port{opacity:.28}.dim .on{opacity:1!important}
/* panel */
#panel{position:absolute;top:10px;right:10px;bottom:10px;width:min(380px,calc(100% - 20px));background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:auto;padding:12px 14px;z-index:4}
#panel h2{font-size:15px;margin:0 0 2px;display:flex;align-items:center;gap:8px;word-break:break-all}
#panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 0 6px}
#panel .sub{color:var(--muted);font-size:12px;margin-bottom:8px;word-break:break-all}
#panel .x{position:absolute;top:8px;right:8px}
#panel table{border-collapse:collapse;width:100%;font-size:12px}
#panel td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:top}
#panel td:first-child{white-space:nowrap}
.pill{display:inline-block;border-radius:9px;padding:0 7px;font-size:11px;background:var(--chip);color:var(--ink);
  margin:1px 2px 1px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.f{border-left:3px solid var(--line);padding:6px 8px;margin:6px 0;background:var(--bg);border-radius:0 6px 6px 0}
.f.high{border-color:var(--danger)}.f.med{border-color:var(--warn)}.f.low{border-color:var(--info)}
.f .t{font-weight:600}.f .d,.f .fx{font-size:12px;color:var(--muted);margin-top:3px}.f .fx b{color:var(--ink)}
.f .loc{font-size:11px;color:var(--muted);cursor:pointer;text-decoration:underline}
.code{font-size:11.5px;background:var(--bg);border-radius:5px;padding:3px 6px;margin:3px 0;white-space:pre-wrap;
  word-break:break-all}
.open{background:var(--bus);color:#fff;border:0}.open:hover{filter:brightness(1.1);background:var(--bus)}
a{color:var(--bus)}
#legend{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:6px 9px;font-size:11.5px;box-shadow:var(--shadow);z-index:3;max-width:calc(100% - 20px)}
#legend div{display:flex;align-items:center;gap:6px;margin:2px 0;white-space:nowrap}
#legend .sw{width:22px;height:0;border-top:3px solid}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:4px 8px;font-size:12px;box-shadow:var(--shadow);z-index:9;max-width:360px}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.bits{display:flex;margin:4px 0 2px;border:1px solid var(--line);border-radius:4px;overflow:hidden;height:18px}
.bits span{flex:1;font-size:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  border-right:1px solid var(--line);color:var(--ink)}
@media (max-width:640px){#q{width:110px}#meta{display:none}}
</style>
</head>
<body>
<header>
  <div id="crumbs"></div>
  <span id="meta"></span>
  <div id="tools">
    <input id="q" list="paths" placeholder="Find block…" aria-label="Find block" autocomplete="off">
    <datalist id="paths"></datalist>
    <select id="flows" hidden aria-label="Flow"></select>
    <select id="export" aria-label="Export" title="Export this level"><option value="">Export…</option><option value="svg">SVG</option><option value="png">PNG</option></select>
    <button id="issues-btn" title="Issues (I)">⚠ <span class="n">0</span></button>
    <button id="b-dom" title="Colour by clock domain (D)" aria-pressed="true"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
    <button id="b-tidy" title="Clock/reset wires (W)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 8h3l2-4 2 8 2-4h5"/></svg></button>
    <button id="b-unc" title="Show unconnected pins (U)" aria-pressed="false"><svg viewBox="0 0 16 16"><circle cx="3" cy="8" r="1.5" fill="currentColor"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><circle cx="13" cy="8" r="1.5" fill="currentColor"/></svg></button>
    <button id="b-fit" title="Fit to screen (F)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg></button>
    <button id="b-theme" title="Theme (T)"><svg viewBox="0 0 16 16"><path d="M13.5 10.5A6 6 0 0 1 5.5 2.5a6 6 0 1 0 8 8z" fill="currentColor"/></svg></button>
  </div>
</header>
<main id="main">
  <svg id="svg" role="img" aria-label="Block diagram">
    <defs>
      <linearGradient id="g-ip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--box)"/><stop offset="1" stop-color="var(--box2)"/></linearGradient>
      <linearGradient id="g-ps" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ps)"/><stop offset="1" stop-color="var(--box2)"/></linearGradient>
      <linearGradient id="g-hier" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--hier)"/><stop offset="1" stop-color="var(--hier2)"/></linearGradient>
    </defs>
    <g id="vp"></g>
  </svg>
  <div id="legend" hidden></div>
  <aside id="panel" hidden></aside>
  <div id="empty" hidden>Empty level</div>
</main>
<div id="tip" hidden></div>
<script type="application/json" id="fpa-data">/*FPA:DATA*/</script>
<script>/*FPA:ELK*/</script>
<script>
(function () {
"use strict";
const D = JSON.parse(document.getElementById("fpa-data").textContent);
const defs = D.defs, FIND = D.findings || [], ANN = D.annotations || [], NOTES = D.notes || {}, FLOWS = D.flows || [];
const NETDOM = D.netdom || {}, DOMS = D.domains || {};
const PAL = ["#2f80ed", "#f2994a", "#27ae60", "#9b51e0", "#00a3a3", "#c2185b", "#8d6e63", "#607d8b"];
const DCOL = {}; Object.keys(DOMS).forEach((k, i) => DCOL[k] = PAL[i % PAL.length]);
const SEVC = {high: "var(--danger)", med: "var(--warn)", low: "var(--info)", info: "var(--muted)"};
const SEVR = {high: 0, med: 1, low: 2, info: 3};
const TITLES = {processing_system7: "ZYNQ7 Processing System", zynq_ultra_ps_e: "Zynq UltraScale+ MPSoC",
  versal_cips: "Control, Interface & Processing System", axi_dma: "AXI Direct Memory Access", axi_gpio: "AXI GPIO",
  axi_interconnect: "AXI Interconnect", smartconnect: "AXI SmartConnect", proc_sys_reset: "Processor System Reset",
  xlconcat: "Concat", xlconstant: "Constant", xlslice: "Slice", axi_bram_ctrl: "AXI BRAM Controller",
  blk_mem_gen: "Block Memory Generator", clk_wiz: "Clocking Wizard", axis_data_fifo: "AXI4-Stream Data FIFO",
  axi_uartlite: "AXI Uartlite", axi_iic: "AXI IIC", axi_quad_spi: "AXI Quad SPI", axi_timer: "AXI Timer",
  axi_intc: "AXI Interrupt Controller", util_vector_logic: "Utility Vector Logic", util_ds_buf: "Utility Buffer",
  axis_clock_converter: "AXI4-Stream Clock Converter", axi_clock_converter: "AXI Clock Converter",
  axi_protocol_converter: "AXI Protocol Converter", axi_dwidth_converter: "AXI Data Width Converter",
  axi_crossbar: "AXI Crossbar", system_ila: "System ILA", ila: "ILA", vio: "VIO", axi_vdma: "AXI Video DMA",
  axi_cdma: "AXI Central DMA", axi_fifo_mm_s: "AXI-Stream FIFO", xadc_wiz: "XADC Wizard",
  axis_dwidth_converter: "AXI4-Stream Data Width Converter", axis_subset_converter: "AXI4-Stream Subset Converter",
  axis_broadcaster: "AXI4-Stream Broadcaster", axis_switch: "AXI4-Stream Switch", axi_noc: "AXI NoC",
  util_reduced_logic: "Utility Reduced Logic", fifo_generator: "FIFO Generator", axi_bram: "AXI BRAM"};
const KORD = {bus: 0, clk: 1, rst: 2, data: 3, intr: 4};
const q = new URLSearchParams(location.search);
const S = {path: [], dom: true, unc: false, tidy: null, sel: null, flow: "", cache: {}, t: {x: 0, y: 0, k: 1}};
let clickTimer = null;
const $ = id => document.getElementById(id);
const svg = $("svg"), vp = $("vp");
const NS = "http://www.w3.org/2000/svg";
const ctx2d = document.createElement("canvas").getContext("2d");
const tw = (s, px, bold) => { ctx2d.font = (bold ? "600 " : "") + px + "px Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif"; return ctx2d.measureText(s).width; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

function bodyOf(d) { return (!d.insts.length && d.impl && defs[d.impl]) ? defs[d.impl] : d; }
function defAt(parts) { let d = defs[D.top]; for (const n of parts) { const b = bodyOf(d); const i = b.insts.find(x => x.name === n); if (!i) return null; d = defs[i.def]; } return d; }
function instAt(parts) { if (!parts.length) return null; const p = defAt(parts.slice(0, -1)); return p ? bodyOf(p).insts.find(x => x.name === parts[parts.length - 1]) : null; }
const lvlKey = parts => parts.length ? "/" + parts.join("/") : "";
const pstr = parts => "/" + parts.join("/");
const drillable = d => bodyOf(d).insts.length > 0;
function findingsUnder(p) { return FIND.filter(f => f.path === p || f.path.startsWith(p + "/")); }
function worst(fs) { return fs.reduce((a, f) => (a == null || SEVR[f.sev] < SEVR[a]) ? f.sev : a, null); }
function annOf(p) { return ANN.filter(a => a.path === p); }
function title(d) {
  if (d.kind === "modref") return (d.ref || d.name) + " (RTL)";
  if (d.kind === "hls") return d.name + " (HLS)";
  if (d.kind === "reg") return "REG" + (d.nregs > 1 ? " ×" + d.nregs : "");
  if (d.kind === "comb") return d.name === "assign" || d.name === "concurrent" ? "assign" : "logic";
  if (d.kind === "hier") return "";
  if (d.kind === "prim") return d.name;
  if (d.kind === "rtl" || d.kind === "bd") return d.name + (d.lang === "vhdl" ? " (VHDL)" : "");
  return TITLES[d.name] || d.name;
}
function pinLabel(p) {
  if (p.disp) return p.disp;
  let s = p.name;
  if (p.kind !== "bus" && p.w > 1 && !/\[/.test(s)) s += p.range && /^\[/.test(p.range) && p.range.length < 14 ? p.range : "[" + (p.w - 1) + ":0]";
  return s;
}
function domOf(lk, net) { return NETDOM[lk + "|" + net] || null; }
function dname(d) { const i = DOMS[d] || {}; return (i.name || d) + (i.freq ? " " + (+(i.freq / 1e6).toFixed(3)) + " MHz" : ""); }

/* ---------- graph construction ---------- */
function visiblePins(d, boundary) {
  return d.pins.filter(p => !p.member && (S.unc || !p.unc || (p.kind === "clk" && p.dir === "in" && !boundary)));
}
function addrOf(fullPath) {
  const bdp = (D.meta && D.meta.bd_path) || "";
  const bd = bdp ? defAt(bdp.split("/").filter(Boolean)) : defs[D.top];
  const top = bd && bodyOf(bd);
  return ((top && top.addr) || []).filter(a => !a.excluded && (a.slave === fullPath || bdp + a.slave === fullPath) && !/DDR/i.test(a.block || ""));
}
const PIN_GROUP_MIN = 24, PORT_GROUP_MIN = 16, STACK_MIN = 3;
const skel = s => s.replace(/\d+/g, "#");
function rangeName(names) {
  const runs = names.map(n => n.match(/\d+/g) || []);
  let k = 0;
  return names[0].replace(/\d+/g, m0 => {
    const nums = runs.map(r => Number(r[k])); k++;
    const lo = Math.min(...nums), hi = Math.max(...nums);
    return lo === hi ? m0 : "[" + String(lo).padStart(m0.length, "0") + "-" + String(hi).padStart(m0.length, "0") + "]";
  });
}
/* many same-pattern pins (DAC00..DAC33_M_AXIS) -> one pin "DAC[00-33]_M_AXIS ×16" */
function groupPins(pins, limit) {
  if (pins.length <= limit) return pins.map(p => Object.assign({}, p, {members: [p.name]}));
  const buckets = new Map();
  for (const p of pins) { const k = skel(p.name) + "|" + p.dir + "|" + p.kind; if (!buckets.has(k)) buckets.set(k, []); buckets.get(k).push(p); }
  const out = [];
  for (const ps of buckets.values()) {
    if (ps.length >= 3 && /\d/.test(ps[0].name))
      out.push(Object.assign({}, ps[0], {name: "g:" + skel(ps[0].name) + ":" + ps[0].dir, disp: rangeName(ps.map(p => p.name)) + " ×" + ps.length,
        members: ps.map(p => p.name), group: true, w: null}));
    else ps.forEach(p => out.push(Object.assign({}, p, {members: [p.name]})));
  }
  return out;
}
/* actual pin name -> displayed pin name (groups, and interface members drawn at their interface pin) */
function pinMap(def, shown) {
  const m = {};
  for (const dp of shown) for (const n of dp.members) m[n] = dp.name;
  for (const p of def.pins) if (p.member && !m[p.name]) { const b = p.name.split(".")[0]; if (m[b]) m[p.name] = m[b]; }
  return m;
}
function build(parts) {
  const d = defAt(parts), body = bodyOf(d), lk = lvlKey(parts);
  const nodes = [], edges = [], meta = {};
  const bshown = groupPins(visiblePins(body, true), PORT_GROUP_MIN), bmap = pinMap(body, bshown);
  for (const p of bshown) {
    const w = Math.ceil(tw(pinLabel(p), 11)) + 30, inb = p.dir === "in";
    const id = "p:" + p.name;
    nodes.push({id, width: w, height: 20, ports: [{id: id + "::" + p.name, x: inb ? w : 0, y: 10, width: 1, height: 1,
      layoutOptions: {"elk.port.side": inb ? "EAST" : "WEST"}}],
      layoutOptions: {"elk.portConstraints": "FIXED_POS", "elk.layered.layering.layerConstraint": inb ? "FIRST_SEPARATE" : "LAST_SEPARATE"}});
    meta[id] = {type: "port", pin: p};

    const f = i == null ? null : r.fields[i];
    html += `<span style="flex:${span};background:${f ? PAL[i % PAL.length] + "33" : "transparent"}" title="${f ? esc(f.name) + " [" + (j + span - 1) + ":" + j + "]" : "reserved"}">${f && span > 2 ? esc(f.name) : ""}</span>`; k = j - 1; }
  return html + "</div>";
}
function panel() {
  const P = $("panel"), s = S.sel;
  if (!s) { P.hidden = true; return; }
  let h = `<button class="x" onclick="window.__fpa.select(null)" aria-label="Close">✕</button>`;
  if (s.type === "issues") {
    const fs = FIND.slice().sort((a, b) => SEVR[a.sev] - SEVR[b.sev]);
    h += `<h2>Issues</h2><div class="sub">${fs.length} findings · auto checks + review</div>` + (fs.map(f => fHtml(f, true)).join("") || "<p>No findings.</p>");
  } else if (s.type === "port") {
    const p = s.pin;
    h += `<h2>${esc(p.name)} <span class="pill">port ${esc(p.dir)}</span></h2><div class="sub">${esc([p.kind === "bus" ? p.bus : p.kind, p.w > 1 ? p.w + " bits" : "", p.freq ? p.freq / 1e6 + " MHz" : ""].filter(Boolean).join(" · "))}</div>`;
    if (s.findings.length) h += "<h3>Findings</h3>" + s.findings.map(f => fHtml(f)).join("");
    if (p.phys) h += "<h3>Physical ports</h3>" + p.phys.map(x => `<span class="pill mono">${esc(x[0])}${x[1] != null ? "[" + x[1] + ":" + x[2] + "]" : ""}</span>`).join("");
  } else {
    const cd = s.def, full = s.full, body = G.body, inst = s.inst;
    h += `<h2>${esc(s.stack && !s.copyOf ? s.label : inst.name)}</h2><div class="sub">${esc(title(cd) || cd.kind)}${cd.vlnv ? " · " + esc(cd.vlnv) : ""}</div>`;
    if (s.stack && !s.copyOf) {
      h += `<h3>${s.stack.length} copies</h3><div>` + s.stack.map(i => {
        const n = findingsUnder(pstr(S.path.concat(i.name))).length;
        return `<span class="pill mono" style="cursor:pointer" data-pick="${esc(i.name)}">${esc(i.name)}${n ? " ⚠" + n : ""}</span>`;
      }).join("") + `</div><div class="sub" style="margin-top:6px">Click a copy for its details; double-click the stack to open copy 0.</div>`;
    }
    if (s.copyOf) h += `<div class="sub"><a href="javascript:void 0" data-back="1">◂ all ${s.copyOf.stack.length} copies</a></div>`;
    if (drillable(cd)) h += `<button class="open" onclick="window.__fpa.go(${esc(JSON.stringify(S.path.concat(inst.name)))})">Open ▸</button> `;
    const src = (cd.impl && defs[cd.impl] && defs[cd.impl].src) || cd.src ||
      (inst.line && G.body.src ? {file: G.body.src.file, line: inst.line} : null);
    if (src) h += `<span class="sub">${srcLink(src)}</span>`;
    const fs = findingsUnder(full).sort((a, b) => SEVR[a.sev] - SEVR[b.sev]);
    if (NOTES[full]) h += `<h3>Role</h3><div>${esc(NOTES[full])}</div>`;
    if (fs.length) h += "<h3>Findings</h3>" + fs.map(f => fHtml(f, f.path !== full)).join("");
    const groups = {bus: "Interfaces", clk: "Clocks", rst: "Resets", data: "Signals", intr: "Interrupts"};
    for (const k of Object.keys(groups)) {
      const ps = cd.pins.filter(p => p.kind === k && (S.unc || !p.unc));
      if (!ps.length) continue;
      h += `<h3>${groups[k]}</h3><table>` + ps.map(p => {
        const pr = peers(body, inst.name, p.name), dm = pr && domOf(G.lk, pr.net.name);
        const to = pr ? pr.ends.map(e => e[0] ? e[0] + "/" + e[1] : "◂" + e[1]).slice(0, 4).join(", ") + (pr.ends.length > 4 ? " …" : "") : (p.unc ? "unconnected" : "");
        return `<tr><td class="mono">${p.dir === "in" ? "▸" : "◂"} ${esc(pinLabel(p))}</td><td>${dm ? dm.map(d => `<span class="dot" style="background:${DCOL[d]}" title="${esc(dname(d))}"></span>`).join("") : ""}${esc([p.proto, p.kind === "bus" ? p.bus : "", p.freq ? (p.freq / 1e6) + "MHz" : ""].filter(Boolean).join(" "))}<div class="sub" style="margin:0">${esc(to)}</div></td></tr>`;
      }).join("") + "</table>";
    }
    const ad = addrOf(full);
    if (ad.length) h += "<h3>Address</h3>" + ad.map(a => `<div class="mono">${esc(a.intf)} ${esc(a.base)} · ${esc(a.range || a.high || "")}</div>`).join("");
    if (cd.regs && cd.regs.length) h += "<h3>Registers</h3><table>" + cd.regs.map(r => `<tr><td class="mono">${esc(r.off)}</td><td><b>${esc(r.name)}</b> <span class="sub">${esc(r.acc || "")}</span><div class="sub" style="margin:0">${esc(r.desc || "")}</div>${bitbar(r)}</td></tr>`).join("") + "</table>";
    const an = annOf(full);
    if (an.length) h += "<h3>Software</h3>" + an.map(a => `<div class="sub" style="margin:4px 0 0">${esc(a.kind.toUpperCase())} · ${esc(a.file)}:${esc(a.line)}</div><div class="code mono">${esc(a.text)}</div>`).join("");
    const prm = Object.assign({}, cd.params || {}, inst.params || {});
    const keys = Object.keys(prm);
    if (keys.length) h += "<h3>Parameters</h3><table>" + keys.slice(0, 40).map(k => `<tr><td class="mono">${esc(k)}</td><td class="mono">${esc(prm[k])}</td></tr>`).join("") + "</table>";
  }
  P.innerHTML = h; P.hidden = false;
  P.querySelectorAll("[data-go]").forEach(x => x.onclick = () => reveal(x.getAttribute("data-go")));
  P.querySelectorAll("[data-pick]").forEach(x => x.onclick = () => select(pick(s, x.getAttribute("data-pick"))));
  P.querySelectorAll("[data-back]").forEach(x => x.onclick = () => select({type: "inst", ...s.copyOf}));
}
function metaFor(name) {
  return G.meta["i:" + name] || Object.values(G.meta).find(m => m.stack && m.stack.some(i => i.name === name));
}
function pick(m, name) {  // one copy out of a stack
  if (!m.stack) return {type: "inst", ...m};
  const inst = m.stack.find(i => i.name === name) || m.stack[0];
  return {type: "inst", ...m, inst, full: pstr(S.path.concat(inst.name)), fulls: [pstr(S.path.concat(inst.name))], copyOf: m};
}
function reveal(p) {
  const parts = p.split("/").filter(Boolean);
  let k = parts.length;
  while (k > 0 && !defAt(parts.slice(0, k))) k--;
  const target = parts.slice(0, k);
  go(target.slice(0, -1), true);
  setTimeout(() => { const nm = target[target.length - 1]; const m = metaFor(nm); if (m) select(pick(m, nm)); }, 60);
}

/* ---------- export ---------- */
const XPROPS = ["fill", "fill-opacity", "stroke", "stroke-width", "stroke-dasharray", "stroke-opacity", "stroke-linejoin",
  "stroke-linecap", "opacity", "font-family", "font-size", "font-weight", "font-style", "stop-color", "stop-opacity",
  "letter-spacing", "text-anchor"];
function exportSVG() {  // the whole current level at 1:1, styles inlined so it renders anywhere
  unhover();
  const w = Math.ceil(LAID.width), h = Math.ceil(LAID.height), clone = svg.cloneNode(true);
  const keep = el => !el.closest(".hits");
  const src = [...svg.querySelectorAll("*")].filter(keep), dst = [...clone.querySelectorAll("*")].filter(keep);
  src.forEach((el, i) => {
    const cs = getComputedStyle(el);
    dst[i].setAttribute("style", XPROPS.map(p => p + ":" + cs.getPropertyValue(p)).join(";"));
    dst[i].removeAttribute("class");
  });
  clone.querySelectorAll(".hits").forEach(x => x.remove());
  const v = clone.querySelector("#vp"); v.removeAttribute("transform"); v.removeAttribute("class");
  for (const a of ["id", "class", "role", "aria-label", "style"]) clone.removeAttribute(a);
  Object.entries({xmlns: NS, width: w, height: h, viewBox: `0 0 ${w} ${h}`}).forEach(([k, x]) => clone.setAttribute(k, x));
  const bg = document.createElementNS(NS, "rect");
  Object.entries({width: w, height: h, fill: getComputedStyle(document.body).backgroundColor}).forEach(([k, x]) => bg.setAttribute(k, x));
  clone.insertBefore(bg, clone.firstChild);
  return new XMLSerializer().serializeToString(clone);
}
function exportName() { return (defs[D.top].name + (S.path.length ? "-" + S.path.join("-") : "")).replace(/[^\w.-]+/g, "_"); }
function download(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function doExport(kind) {
  const text = exportSVG();
  if (kind === "svg") return download(new Blob([text], {type: "image/svg+xml"}), exportName() + ".svg");
  const img = new Image(), url = URL.createObjectURL(new Blob([text], {type: "image/svg+xml"}));
  img.onload = () => {
    const c = document.createElement("canvas"), k = 2;
    c.width = img.width * k; c.height = img.height * k;
    const g = c.getContext("2d"); g.scale(k, k); g.drawImage(img, 0, 0);
    c.toBlob(b => download(b, exportName() + ".png")); URL.revokeObjectURL(url);
  };
  img.src = url;
}
$("export").onchange = ev => { const k = ev.target.value; ev.target.value = ""; if (k) doExport(k); };

/* ---------- pan & zoom ---------- */
function apply() { vp.setAttribute("transform", `translate(${S.t.x},${S.t.y}) scale(${S.t.k})`); }
function fit() {
  if (!LAID) return;
  const r = svg.getBoundingClientRect(), pw = $("panel").hidden ? 0 : Math.min(390, r.width * .45);
  const w = LAID.width || 1, h = LAID.height || 1, aw = r.width - pw - 20, ah = r.height - 20;
  const k = Math.min(1.5, aw / w, ah / h);
  S.t = {k, x: (aw - w * k) / 2 + 10, y: (ah - h * k) / 2 + 10}; apply();
}
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const f = Math.exp(-ev.deltaY * (ev.ctrlKey ? .01 : .0018)), k = Math.max(.08, Math.min(5, S.t.k * f));
  S.t.x = mx - (mx - S.t.x) * (k / S.t.k); S.t.y = my - (my - S.t.y) * (k / S.t.k); S.t.k = k; apply();
}, {passive: false});
let drag = null;
svg.addEventListener("pointerdown", ev => { if (ev.target.closest(".node,.port,.hit")) return; drag = {x: ev.clientX, y: ev.clientY, tx: S.t.x, ty: S.t.y, moved: false}; svg.classList.add("drag"); svg.setPointerCapture(ev.pointerId); });
svg.addEventListener("pointermove", ev => { if (!drag) return; const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; S.t.x = drag.tx + dx; S.t.y = drag.ty + dy; apply(); });
svg.addEventListener("pointerup", ev => { if (drag && !drag.moved && !ev.target.closest(".node,.port,.hit")) select(null); drag = null; svg.classList.remove("drag"); });

/* ---------- toolbar ---------- */
function toggle(btn, key) { S[key] = !S[key]; btn.classList.toggle("on", S[key]); btn.setAttribute("aria-pressed", S[key]); }
$("b-dom").classList.add("on");
$("b-dom").onclick = () => { toggle($("b-dom"), "dom"); render(false); };
$("b-unc").onclick = () => { toggle($("b-unc"), "unc"); render(true); };
$("b-fit").onclick = fit;
$("b-tidy").onclick = () => { S.tidy = !(G && G.tidy); $("b-tidy").classList.toggle("on", !S.tidy); render(true); };
$("b-theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nx = cur === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", nx);
  try { localStorage.setItem("fpa-theme", nx); } catch (e) {}
};
try { const th = localStorage.getItem("fpa-theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) {}
const ib = $("issues-btn"); const nHigh = FIND.filter(f => f.sev === "high" || f.sev === "med").length;
ib.querySelector(".n").textContent = FIND.length; if (!FIND.length) ib.querySelector(".n").classList.add("zero");
ib.onclick = () => select(S.sel && S.sel.type === "issues" ? null : {type: "issues"});
if (FLOWS.length) { const fl = $("flows"); fl.hidden = false; fl.innerHTML = `<option value="">Flows…</option>` + FLOWS.map(f => `<option>${esc(f.name)}</option>`).join(""); fl.onchange = () => { S.flow = fl.value; render(false); }; }
const allPaths = [];
(function walk(d, parts, depth) { if (depth > 12 || allPaths.length > 4000) return; for (const i of bodyOf(d).insts) { const p = parts.concat(i.name); allPaths.push(pstr(p)); walk(defs[i.def], p, depth + 1); } })(defs[D.top], [], 0);
$("paths").innerHTML = allPaths.map(p => `<option value="${esc(p)}">`).join("");
$("q").addEventListener("change", ev => { const v = ev.target.value.trim(); const hit = allPaths.find(p => p === v) || allPaths.find(p => p.endsWith("/" + v)) || allPaths.find(p => p.includes(v)); if (hit) reveal(hit); ev.target.value = ""; ev.target.blur(); });
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT") return;
  const k = ev.key.toLowerCase();
  if (k === "escape" || k === "backspace") { if (S.sel) select(null); else if (S.path.length) go(S.path.slice(0, -1)); ev.preventDefault(); }
  else if (k === "f") fit(); else if (k === "d") $("b-dom").click(); else if (k === "u") $("b-unc").click();
  else if (k === "t") $("b-theme").click(); else if (k === "i") ib.click(); else if (k === "w") $("b-tidy").click();
  else if (k === "/") { $("q").focus(); ev.preventDefault(); }
  else if (k === "enter" && S.sel && S.sel.type === "inst" && drillable(S.sel.def)) go(S.path.concat(S.sel.inst.name));
});
addEventListener("resize", () => fit());
addEventListener("hashchange", () => { const parts = decodeURIComponent(location.hash.slice(1)).split("/").filter(Boolean); if (pstr(parts) !== pstr(S.path)) go(parts); });
const m = D.meta || {};
$("meta").textContent = [m.part, m.tool ? "Vivado " + m.tool : ""].filter(Boolean).join(" · ");
window.__fpa = {go, select, state: S};
const start = decodeURIComponent(location.hash.slice(1)).split("/").filter(Boolean);
if (q.get("theme") === "dark" || q.get("theme") === "light") document.documentElement.setAttribute("data-theme", q.get("theme"));
go(start);
if (q.get("issues")) setTimeout(() => select({type: "issues"}), 300);
if (q.get("sel")) setTimeout(() => reveal(q.get("sel")), 300);
})();
</script>
